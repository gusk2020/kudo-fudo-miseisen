<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#16324a">
<title>酷道・腐道・未成線 Stage1 地図生成</title>
<link rel="icon" href="data:,">
<link rel="stylesheet" href="/src/style.css">
</head>
<body>
<div id="stage"></div>
<header id="top">
  <button id="btn-prev" aria-label="前の工程">‹</button>
  <div id="step-title">読込中…</div>
  <button id="btn-next" aria-label="次の工程">›</button>
</header>
<div id="status" role="status"></div>
<div id="tools-wrap"><nav id="toolbar"></nav></div>
<div id="dock">
  <button data-sheet="layers">レイヤー</button>
  <button data-sheet="issues" id="dock-issues">検証</button>
  <button data-sheet="menu">保存</button>
  <button id="btn-undo">取消</button>
  <button id="btn-redo">やり直し</button>
  <button id="btn-fit">全体</button>
</div>
<section id="sheet" hidden>
  <button id="sheet-close" aria-label="閉じる">×</button>
  <div id="sheet-body"></div>
</section>
<div id="toast" hidden></div>
<script type="module" src="/src/main.ts"></script>
</body>
</html>
