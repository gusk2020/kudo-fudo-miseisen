name: Stage 42 isolated playtest package (NO DEPLOY)
on:
  push:
    branches: [claude/s42-playtest-package]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  package:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          ref: 9e0a8c805f29af18e8cf018254832d79573aa5c7
          path: published41
      - uses: actions/checkout@v4
        with:
          path: stage42
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Build pinned live Stage 41 at the existing root
        working-directory: published41
        run: |
          npm ci
          BASE_PATH=/kudo-fudo-miseisen/ npm run build
      - name: Build isolated Stage 42 for /stage42/
        working-directory: stage42
        env:
          BASE_PATH: /kudo-fudo-miseisen/stage42/
          VITE_SAVE_NS: stage42trial
        run: |
          npm ci
          npm run build
      - name: Assemble two versions without writing to Pages
        run: |
          mkdir -p composite/stage42
          cp -a published41/dist/. composite/
          cp -a stage42/dist/. composite/stage42/
          test -s composite/index.html
          test -s composite/stage42/index.html
          grep -q '/kudo-fudo-miseisen/stage42/' composite/stage42/index.html
          if grep -q '/kudo-fudo-miseisen/stage42/' composite/index.html; then
            echo "::error::Stage 41 root must not refer to Stage 42"
            exit 1
          fi
          grep -rl 'stage42trial' composite/stage42/assets/ >/dev/null || { echo "::error::Stage 42 storage isolation missing"; exit 1; }
          (cd published41/dist && find . -type f -print0 | sort -z | xargs -0 sha256sum) > stage41-root-sha256.txt
          (cd composite && find . -maxdepth 1 -type f -print0 | sort -z | xargs -0 sha256sum) > root-file-sha256.txt
          echo "Packaged Stage 41 root + isolated Stage 42 subdirectory. Not deployed."
      - name: Rebuilt Stage 41 root is byte-identical to the live Pages site (read-only GET)
        run: |
          cd published41/dist; bad=0; n=0
          for f in $(find . -type f | sed 's|^\./||' | sort); do
            live=$(curl -fsS --max-time 60 "https://gusk2020.github.io/kudo-fudo-miseisen/$f" | sha256sum | cut -d' ' -f1) || live=none
            mine=$(sha256sum "$f" | cut -d' ' -f1); n=$((n+1))
            if [ "$live" != "$mine" ]; then echo "::error::live differs from the rebuilt Stage 41 root: $f"; bad=$((bad+1)); fi
          done
          echo "files compared: $n, different: $bad"; test "$bad" -eq 0
      - name: No bare browser-storage names in the Stage 42 bundle
        run: |
          if grep -rEq 'localStorage\.(get|set|remove)Item\("kfm' composite/stage42/assets; then echo "::error::a storage key without the trial prefix"; exit 1; fi
          if grep -rEq 'indexedDB\.open\("kfm-stage1"' composite/stage42/assets; then echo "::error::the real game's database name in the trial"; exit 1; fi
      - name: Real-browser isolation check (real game and /stage42/ on one origin)
        working-directory: stage42
        run: |
          npx playwright install --with-deps chromium
          node tools/isolation-check.mjs ../composite
      - uses: actions/upload-artifact@v4
        with:
          name: stage42-isolated-preview-site
          path: composite/
          retention-days: 14
          if-no-files-found: error
      - uses: actions/upload-artifact@v4
        with:
          name: stage42-root-reference-manifest
          path: |
            stage41-root-sha256.txt
            root-file-sha256.txt
          retention-days: 14
          if-no-files-found: error
