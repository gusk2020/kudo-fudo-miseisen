name: n03-probe
on:
  workflow_dispatch:
  push:
    branches: [claude/stage40]
    paths: ['.github/workflows/n03-probe.yml']
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - run: |
          curl -sSL -m 120 -o t.zip https://nlftp.mlit.go.jp/ksj/gml/data/N03/N03-2000/N03-001001_13_GML.zip; ls -l t.zip
          unzip -o -q t.zip -d t; find t -type f | head -20
          f=$(find t -iname "*.xml" | head -1); echo "=== $f"; wc -c "$f"; head -c 2500 "$f"; echo
          echo "=== distinct feature tags"; grep -o -E "<ksj:[A-Za-z0-9]+" "$f" | sort | uniq -c | head
          echo "=== sample AdministrativeArea"; grep -n -m3 -A12 "<ksj:AdministrativeArea " "$f" | cut -c1-200 | head -40
          echo "=== readme/spec"; find t -iname "*.txt" -o -iname "*readme*" | head
          python3 -c "import sys;print(sys.version)"; ogrinfo --version 2>&1 | head -1
