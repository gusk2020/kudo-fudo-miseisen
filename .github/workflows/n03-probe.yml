name: n03-probe
on:
  workflow_dispatch:
  push:
    branches: [claude/stage40]
    paths: ['.github/workflows/n03-probe.yml']
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - name: fetch pages
        run: |
          set -x
          curl -sSL -m 60 -o n03.html https://nlftp.mlit.go.jp/ksj/gml/datalist/KsjTmplt-N03-v2_2.html; echo "rc=$?"; wc -c n03.html
          python3 - <<'P'
          import re,html
          s=open('n03.html',encoding='utf-8',errors='replace').read()
          t=re.sub(r'<script.*?</script>|<style.*?</style>','',s,flags=re.S)
          print(html.unescape(re.sub(r'<[^>]+>',' ',t))[:3500].replace('\n',' '))
          for m in re.findall(r'(?:href|onclick)="[^"]*(?:N03|zip)[^"]*"',s)[:60]: print(m)
          P
      - name: license
        run: |
          curl -sSL -m 60 https://nlftp.mlit.go.jp/ksj/other/agreement.html -o ag.html; echo rc=$?; python3 -c "
          import re,html;s=open('ag.html',encoding='utf-8',errors='replace').read();print(html.unescape(re.sub(r'<[^>]+>',' ',s))[:3500])"
      - name: geoshape
        run: |
          curl -sSL -m 60 -o g.html https://geoshape.ex.nii.ac.jp/city/; echo rc=$?; wc -c g.html; python3 -c "
          import re,html;s=open('g.html',encoding='utf-8',errors='replace').read();print(html.unescape(re.sub(r'<[^>]+>',' ',s))[:2500])"
