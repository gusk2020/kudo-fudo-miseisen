name: n03-probe
on:
  workflow_dispatch:
  push:
    branches: [claude/stage40]
    paths: ['.github/workflows/n03-probe.yml']
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - run: |
          curl -sSL -m 120 -o t.zip https://nlftp.mlit.go.jp/ksj/gml/data/N03/N03-2000/N03-001001_13_GML.zip
          unzip -o -q t.zip -d t; f=$(find t -iname "*.xml" | head -1); echo "=== $f"; find t -type f
          echo "=== structure (coords stripped)"; grep -v -E "^[0-9. -]+$" "$f" | sed -E 's/[0-9]+\.[0-9]+ [0-9]+\.[0-9]+/<c>/g' | cut -c1-160 | head -75
          echo "=== one full area record"; grep -n -m1 -B2 -A16 "<ksj:administrativeAreaCode" "$f" | cut -c1-170
          echo "=== counts"; for t in "gml:Curve " "gml:Surface" "ksj:AdministrativeBoundary " "ksj:AdministrativeArea"; do echo "$t $(grep -c "<$t" "$f")"; done
