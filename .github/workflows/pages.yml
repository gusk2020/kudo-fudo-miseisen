name: Pages
on:
  push:
    branches: [main, claude/stage1-map-generator, claude/stage2-roads, claude/stage2-road-evolution, claude/stage3-foundation, claude/stage4-issue13, claude/stage5-issue15, claude/stage6-issue18, claude/stage7-sim, claude/stage8-issue22, claude/stage9-issue24, claude/stage10-issue26, claude/stage11-issue28, claude/stage12-issue31, claude/stage13-issue33, claude/stage14-issue35, claude/stage17-potential, claude/stage18-sea-air-names, claude/stage19-tabs-map-seats, claude/stage20-islands-seats, claude/stage21-pickers-road, claude/stage22-sea-map-2200, claude/stage22-audit, claude/stage23, claude/stage24]
  workflow_dispatch:
permissions: { contents: read, pages: write, id-token: write }
concurrency: { group: pages, cancel-in-progress: true }
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm }
      - run: npm ci
      - run: npm test
      - run: npm run build
        env: { BASE_PATH: "/kudo-fudo-miseisen/" }
      - uses: actions/upload-pages-artifact@v3
        with: { path: dist }
  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment: { name: github-pages, url: "${{ steps.d.outputs.page_url }}" }
    steps:
      - id: d
        uses: actions/deploy-pages@v4
